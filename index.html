<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Wholesaler Purchase Manager - Login</title>

    <link rel="stylesheet" href="index.css">
</head>

<body>

    <div class="login-page">

        <div class="login-card">

            <!-- Logo -->
            <div class="logo">
                🛒
            </div>

            <h1>Welcome Back</h1>

            <p class="subtitle">
                Wholesaler Purchase Manager
            </p>

            <!-- Login Form -->
            <form id="loginForm">

                <!-- Username -->
                <div class="input-group">

                    <label for="username">
                        Username
                    </label>

                    <div class="input-box">

                        <span>👤</span>

                        <input
                            type="text"
                            id="username"
                            placeholder="Enter username"
                            required
                        >

                    </div>

                </div>


                <!-- Password -->
                <div class="input-group">

                    <label for="password">
                        Password
                    </label>

                    <div class="input-box">

                        <span>🔒</span>

                        <input
                            type="password"
                            id="password"
                            placeholder="Enter password"
                            required
                        >

                        <button
                            type="button"
                            id="showPassword"
                            class="show-password"
                        >
                            👁
                        </button>

                    </div>

                </div>


                <!-- Login Button -->
                <button
                    type="submit"
                    class="login-button"
                >
                    Login
                    <span>→</span>
                </button>


                <!-- Error Message -->
                <p id="errorMessage"></p>

            </form>


            <!-- Bottom Text -->
            <div class="bottom-text">
                🏪 Manage your wholesaler purchases easily.
            </div>

        </div>

    </div>


    <script src="index.js"></script>

</body>
</html>
